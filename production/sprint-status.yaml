    #   ⇒ The stale comment has now been corrected AT SOURCE, with a note on why it mattered:
    #     a comment describing ANOTHER file's behaviour is a claim with an expiry date, and this
    #     one cost a mis-scoped story.
    # ✅ HQ_DAMAGE_DEALT implemented and made the default anyway, because it is the right
    #   expression even though it changes nothing today:
    #   ★ MATHEMATICALLY IDENTICAL to TOTAL_HQ_HP while both HQs share a max hp — P0 wins under
    #     damage-dealt iff (max - hp1) > (max - hp0) iff hp0 > hp1, which IS the TOTAL_HQ_HP
    #     comparison. VERIFIED, not argued: mirror cell returns IDENTICAL WINNERS 12/12, and a
    #     unit test pins the ordering agreement across seven damage configurations.
    #   WHY SHIP IT:
    #     1. It stops being equivalent the moment the HQs differ. faction-identity allows
    #        per-faction structure deltas; the instant one HQ has more hp, "whose HQ is
    #        healthier" rewards WHOEVER WAS HANDED THE BIGGER HQ, while "who dealt more damage"
