    # ⚠⚠ FIRST, A CORRECTION TO s7-16. It recommended this change on the grounds that "all ten
    #   second-mover wins are unit-count tiebreaks". THAT WAS WRONG. I repeated the stale note
    #   on VS_MAX_ROUNDS ("UNIT_COUNT is the only implemented metric") instead of checking; the
