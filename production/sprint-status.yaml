# SPRINT 7 — HARDEN WHAT EXISTS. Plan: production/sprints/sprint-7.md
# ============================================================================
# No new mechanics, no new content, no design calls. Works Sprint 6's retro
# action items, three of which pointed at one hole: NOTHING IN SIX SPRINTS HAD
# EVER BEEN EXPORTED. There was no export_presets.cfg at all, so there was
# nothing to be wrong -- which is exactly why nobody noticed the game could not
# be packaged.
#
# ⛔ THE FIRST EXPORT FOUND TWO SHIP-BLOCKING DEFECTS, both invisible to a
#   1,233-test green suite:
#   1. S7-01 `class_name Research` was declared under tests/ while production
#      called it in three places -- one of them GameState.start_turn step 3,
#      UNCONDITIONALLY EVERY TURN, the others Unit.effective_attack and
#      effective_defense. Second instance of this defect in two days, after
#      Structure was found at the Sprint 6 close-out.
#   2. S7-02 UnitConfig.surcharge_for() read UnitBalance.units.* while the
#      UnitBalance autoload preloads a UnitConfig .tres -- a PARSE-TIME cycle.
#      The editor resolves it (populated class cache, incremental re-parse); a
#      packaged build resolves each script once in dependency order and a cycle
#      has no valid order. The exported build failed to load unit_config.gd.
#
# ★★ THE SHAPE BOTH SHARE, and the reason the guards are structural rather than
#   behavioural: invisible in every build a developer runs, fatal in the build a
#   player runs. NO behavioural test can see either -- a green suite is not
#   evidence against them.
#
# ★★ AND THE MOST INSTRUCTIVE MOMENT: S7-03's first guard flagged the display
#   string "Research complete" (prose containing a class name). Blanking string
#   literals fixed that and SILENTLY BROKE THE OTHER GUARD -- blanking removed
#   the "res://..." inside preload(), so the cycle check passed WITH THE CYCLE
#   PRESENT. A check that cannot fail is worse than no check. Caught only by
#   re-introducing each defect on purpose.
#   ⇒ VERIFY A NEW TEST BY WATCHING IT FAIL, NEVER BY WATCHING IT PASS.
#
# ★ NOT IN THIS SPRINT, deliberately: the one-unit cliff (a design call that is
#   the user's, and the most valuable open question on the project); S5-03's
#   naive-observer session and S5-04's Analyses A/C/D (need a human at a
