    completed: "2026-08-25"
    # ✅ DONE. User's brief: "turn on cover and teach the AI to use it."
    # ★ COVER NEEDED NO NEW MECHANICS. cover_dr, GridState.is_cover, BoardRenderer cover props
    #   and tile_cover art all shipped in the Foundation sprints and had been INERT ever since,
    #   because NO MAP EVER PLACED A TILE. Four hand-built copies of the VS map (slice,
    #   simulator, 2 diagnostic tools) agreed only because all four were trivially blank.
    # 1. NEW src/core/map/vs_map.gd — ONE authored map, the four duplicates now call it.
    #    simulate_matches.gd's own header demands it mirror the slice; that promise was kept
    #    only by everything being empty.
    # 2. 8 cover tiles of 120 (~7%), mirror-symmetric, clear of both deploy rings.
    # 3. AI: only the MOVE half needed code. ★ ATTACK scoring already accounted for cover and
    #    always had — _consider_attack values through Combat.preview_damage, which applies
    #    cover_dr. A test pins that so nobody adds a second term and double-counts.
    #    AIConfig.cover_value 0.30, sized between a tile of progress (0.16) and a setup (0.4).
    # ★★ TWO MEASURED RESULTS THAT CAME OUT BACKWARDS:
    #   a) "Let a unit trade one tile of progress for cover" made cover usage WORSE:
    #      blind 5.5% -> score-only 6.1% -> with discount 4.7%. A unit that steps back into
    #      cover is further away, so next turn it advances and LEAVES. Cover rewards a defender
    #      who stays put and THIS AI NEVER STAYS PUT. cover_tile_discount kept at 0 with the
    #      finding written beside it.
    #   b) Cover in the lane both sides must cross turns CLOSE GAMES INTO DRAWS. First layout
    #      (14 tiles incl. the centre HQ-to-HQ pair): resolve-on-play 19/22 -> 15/22, and the
    #      +1 cell went 1/6 -> 5/6 reaching the round cap. Handicaps +2/+3 untouched at 25-30
    #      turns throughout — ALL the damage was in the nearly-even games. ⇒ COVER BELONGS
    #      WHERE A PLAYER CHOOSES TO FIGHT, NOT WHERE THEY ARE FORCED TO. Lane now open.
    # GATE re-verified (8 tiles): resolve 17/22 (no-cover 19/22, 14-tile 15/22), conversion
    #   18/18, seats P0 9 / P1 13, mean 33.2 turns, cover occupancy 4.7% of unit-turns.
    #   Suite 1253/1253 (+17 new tests). Menu and slice both boot with zero errors.
    # ⚠ THE AI USES COVER ONLY LIGHTLY (4.7% vs ~7% of the board). It is an aggressive agent
    #   that is nearly always moving. A genuinely cover-aware tactician needs a HOLD-POSITION
    #   BEHAVIOUR — a real AI feature, not a weight. The player benefits far more than the AI,
    #   and that half is not measured here at all.
    # ⛔ NEXT LEVER, AND IT IS A DESIGN CALL: VS_MAX_ROUNDS (30) is now the binding constraint
    #   on close games — it was calibrated before BOTH the S7-10 cooldown change and cover.
    #   5 of the 7 unresolved games are the +0/+1 close cells. Raising it converts stalemates
    #   into finishes at the cost of longer matches.

  - id: "s7-12"
    name: "Raise the round cap 30 → 40 — and the seat bias it uncovered"
    file: "production/playtests/s7-12-round-cap-2026-08-25.md"
    priority: must-have
    status: done
    owner: "systems-designer + qa-lead"
    estimate_days: 0.5
    blocker: ""
    completed: "2026-08-25"
    # ✅ DONE. 30 rounds was calibrated in Sprint 5; TWO later changes lengthened matches and
    # neither re-derived it — s7-10 (faster reinforcement, bigger armies) and s7-11 (cover, -1
    # damage per hit). The cap had become the binding constraint, and SELECTIVELY so: the
    # nearly-even +1 cell had 3/6 games ending on the cap while +2/+3 finished at 25-30 turns.
    #   cap 30: resolve 17/22, +1 cell 3/6 capped, mean 33.2 turns
    #   cap 40: resolve 20/22, +1 cell 0/6 capped, mean 38.7 turns   <-- shipped
    # ✅ Every handicapped game now finishes on play. The 2 remaining unresolved are the mirror
    #   cell, which is CORRECT — a deterministic AI on a symmetric board should tiebreak.
    # ⚠ Cost: mean 33 -> 39 turns; a capped game runs 80 turns instead of 60.
    #
    # ⛔⛔ WHAT IT UNCOVERED, and this is bigger than the cap change:
    #   Conversion moved 18/18 -> 15/18, which LOOKS like the comeback earlier sprints hunted
    #   for. IT IS NOT. All three "upsets" are the same game: P1 wins ALL SIX +1 games
    #   regardless of which side got the extra Trooper, and all four mirrors.
    #   ⇒ IN CLOSE GAMES THE WINNER IS THE SEAT, NOT THE PLAY.
    #   Ruled out, each by measurement:
    #     - NOT turn order — the mirror cell alternates the starting player and P1 wins either way
    #     - NOT the faction — rush/boom/neutral all carry unit_deltas = [], mechanically identical
    #     - NOT the cover layout — tile symmetry is pinned by a test, and the RESOLVED mirrors go
    #       to P1 on a plain board too (--plain --max-rounds=40)
    #   What cover DID change: plain mirrors split 2/2, cover mirrors 4/0 to P1 — the difference
    #   is entirely in the two games that reach the cap and are decided by the unit-count
    #   TIEBREAK. Cover moved who wins a tiebreak; it did not create the bias.
    #   ★ The bias PREDATES all of it. S5-04 saw it at n=4 as "a signal, not a proof". Raising
    #     the cap did not cause it — IT STOPPED HIDING IT.
    #
    # ⇒ CONSEQUENCES FOR NUMBERS ALREADY RECORDED:
    #   - s6-06's "18/18 converts" was partly the cap truncating games the favoured side was
    #     losing and awarding them on unit count.
    #   - s7-09/s7-10 swept the +1 cell, the cell most affected. Their RELATIVE comparisons
    #     (measured under identical conditions) hold; the absolute "one Trooper ≈ N% of decision
