    # ✅ 6ae29d3. BLOCKED THE MEASUREMENT — a keyboard player was playing a broken game.
    # 1. KEYBOARD COULD NOT CHOOSE A VERB AT ALL. Godot's Button does not accept the PRESS half of
    #    a keyboard activation — it arms and waits for the release. So the press ALSO reached
    #    _unhandled_input, which treated it as the board's confirm, re-selected the entity under
    #    the cursor, and REBUILT THE MENU OUT FROM UNDER THE ROW THAT WAS MID-PRESS. The release
    #    then landed on a fresh row that had never seen a press, so `pressed` never fired.
    #    ⚠ Invisible unless the cursor stood on a selectable owned entity — WHICH IS THE NORMAL
    #      CASE, because selecting one is how the menu got opened. On an empty tile the re-select
    #      failed, nothing rebuilt, and the row worked. Same keypress, opposite outcome, which is
    #      exactly how it was reported. ui_accept now belongs to the menu whenever a row has focus.
    # 2. TEARING DOWN A FOCUSED ROW LEFT THE BOARD DEAF. Rebuilding the plate freed rows still
    #    holding keyboard focus, leaving the viewport routing key events at a DANGLING POINTER and
    #    marking them handled — so _unhandled_input stopped being called. Focus is now released
    #    before the rows are destroyed, and before the fade-out rather than at the end of it.
    # 3. ⛔ BUILD HAD NEVER WORKED FROM THE UI. build_type_chosen was emitted INTO A VOID.
    #    begin_build_preview() had no production caller; THE TESTS CALLED IT DIRECTLY, which is
    #    why the suite stayed green while the only path a player can take was dead.
    #    ⚠ THIRD DEAD HOOK FOUND THIS WAY (after board_cursor_cycle, notify_action_applied).
    # ★ Tests deliberately push REAL InputEventKey through the viewport and press REAL picker rows,
    #   because every method in both chains already worked WHEN CALLED BY HAND. action-menu.md AC-9
    #   ("complete a full move using only the keyboard") had NO TEST AT ALL — it does now, and it
    #   fails without the fix. Suite 1290/1290.

