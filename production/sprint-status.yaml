  - id: "s7-13"
    name: "★★ Chase the seat bias — ROOT CAUSE FOUND (BFS neighbour order)"
    file: "production/playtests/s7-13-seat-bias-2026-08-25.md"
    priority: must-have
    status: done
    owner: "ai-programmer + qa-lead"
    estimate_days: 0.5
    blocker: ""
    completed: "2026-08-25"
    # ✅ ROOT CAUSE PROVEN. NOT FIXED — the fix is a deliberate AI change, see below.
    # ★★ Movement.reachable() expands neighbours N->E->S->W, and the AI's advance fold keeps
    #   the FIRST tile among equal-scoring candidates (_is_better needs STRICTLY better to
    #   replace). So BFS enumeration order becomes a hidden DIRECTIONAL PREFERENCE that
    #   decides matches. Changing that one line changes who wins:
    #     N->E->S->W (shipped): material converts  7/14, east seat wins 14/14
    #     N->W->S->E (probe)  : material converts 14/14, seats split 7/7  <-- fair
    # ★ WHY IT IS ASYMMETRIC BETWEEN THE SEATS: for the WEST player the easterly tie-break tile
    #   is TOWARD the enemy; for the EAST player it is BACK toward its own base. The same rule
    #   pulls one side into the open and lets the other consolidate — and in a deterministic
    #   game with no fog, whoever commits first loses the exchange.
    #   ⇒ This is S5-04's "the player who moves first loses every mirror" seen from its actual
    #     cause. It was never about moving first; it was about being pulled forward.
    # NARROWED BY CONTROLLED RUNS, not by reading code:
    #   - NOT the player index — mirror cell identical (1:3) whichever seat is forced to start
    #   - NOT turn order — same table; a small first-mover component exists in the +1 cell but
    #     runs the OPPOSITE way (P0 wins 4 moving second, 0 moving first)
    #   - IS the board position — swapping which HQ each seat owns moves the advantage with it
    #     (normal P0 0 / P1 14; swapped P0 10 / P1 4)
    # ⚠⚠ THE FIRST SWAP EXPERIMENT WAS INVALID AND IT NEARLY SHIPPED AS A CONCLUSION.
    #   _bonus_tile and the mirror seeding read the HQ_A/HQ_B CONSTANTS instead of the HQ each
    #   seat actually owned, so under --swap-hqs the favoured player's bonus Troopers spawned
    #   BESIDE THE ENEMY BASE. Both now take the owning HQ as a parameter, and the un-swapped
    #   path was re-verified to reproduce P0 0 / P1 14 EXACTLY before the swapped result was
    #   believed. ⇒ Re-derive the control after touching a harness, every time.
    # ⛔ WHAT THIS INVALIDATES:
    #   - s6-06's "material advantage converts 18/18" is NOT a measure of the economy or combat.
    #     Under the shipped order it is 7/14 on a fair-start batch; 18/18 was the east seat
    #     winning its own games plus the round cap truncating the rest.
    #   - s7-09 (skill floor) and s7-10 (exchange rate) both ran with this bias present. Their
    #     RELATIVE comparisons hold (both arms under identical conditions); NO ABSOLUTE BALANCE
    #     CLAIM SURVIVES.
    # ⛔ THE FIX IS NOT "REVERSE THE ORDER" — N->W->S->E is just a different arbitrary direction
    #   that happens to test well on an east-west map and would bias the other way on a
    #   north-south one. The correct fix is a MIRROR-INVARIANT tie-break in the AI: when
    #   candidates tie on distance and score, decide on something independent of enumeration
    #   order (distance to enemy HQ, then own HQ, then a deterministic final key). That is a
    #   behavioural AI change that will move every number recorded to date — deliberate work,
    #   not an end-of-session patch.
    # ★ USER'S SUGGESTION ASSESSED: a first-turn AP reduction does NOT address this. It is the
    #   standard remedy for a first-MOVER advantage, and the mirror cell shows turn order
    #   contributes nothing (identical whichever seat starts). The small turn-order component
    #   that does exist runs the OPPOSITE way — moving first is a slight DISADVANTAGE — so
    #   cutting the first player's AP would deepen the real problem rather than offset it.
    # Harness gained --start-player=N and --swap-hqs. Suite 1253/1253. No production behaviour
    # changed by this story.

  - id: "s7-14"
    name: "★★ Fix the tie-break mirror-invariantly, and re-validate everything downstream"
    file: "production/playtests/s7-14-tiebreak-fix-2026-08-25.md"
    priority: must-have
    status: done
    owner: "ai-programmer + qa-lead"
    estimate_days: 1.0
    blocker: ""
    completed: "2026-08-25"
    # ✅ DONE. Replaces "first tile enumerated wins" with a tie-break in EACH PLAYER'S OWN FRAME,
    # applied everywhere a destination is chosen (advance, siege, retreat, move+attack combo):
    #   1. closer to the enemy HQ  (each seat measures toward its own opponent)
    #   2. closer to the HQ-to-HQ axis  (prefer the lane over a flank drift)
    #   3. smaller coordinate on the axis PERPENDICULAR to the HQ-to-HQ line
    # ★ Step 3 is the subtle one: a total deterministic order needs SOME coordinate key, but a
    #   coordinate key is only harmful on the axis the players are mirrored across. Taking it
    #   perpendicular makes both seats express the IDENTICAL preference — the bias becomes
    #   SHARED rather than SIDED, and shared is fair.
    # ⛔ Deliberately NOT reversing Movement's neighbour order: that is a different arbitrary
    #   direction that merely tests well on an east-west map. The order is Movement's own
    #   determinism contract and was never the bug; treating enumeration order as a DECISION
    #   RULE was.
    # ★ Retreat and the attack combo now fold into a PER-ENTITY local best before competing
    #   globally — a tile-versus-tile comparison across two different entities is meaningless.
    #   _Candidate carries its destination tile for the same reason.
    #
    # RE-RUN 1 — S6-06 GATE:
    #   seat split       P0 6 / P1 16  ->  P0 12 / P1 10   ✅ essentially even
    #   material converts        15/18  ->  16/18          ✅
    #   handicapped resolving on play   ->  18/18          ✅
    #   resolve on play (all)    20/22  ->  18/22
    #   ★ The 20 -> 18 is CORRECT, not a regression: all four MIRROR games now reach the cap,
    #     where before two were won outright. A genuinely symmetric deterministic match SHOULD
    #     tiebreak; one side winning it was the bias, not play.
    #
    # RE-RUN 2 — SKILL SWEEP (+1 cell, n=14, underdog wins):
    #   degrade    0%    5%   10%   15%   20%   30%   40%   50%
    #   before   0/14  1/14  3/14  6/14  5/14  9/14  9/14 11/14
    #   after    2/14  4/14  4/14  4/14  7/14  9/14  9/14 12/14
    #   ★ THE 0% ROW MOVED OFF ZERO. A one-unit lead at equal play now converts 12/14 rather
    #     than 14/14. The old perfect determinism was PARTLY THE SEAT BIAS fixing outcomes; the
    #     game now has real variance at the top of the curve while still converting "more often
    #     than not", which is what the gate actually asks for.
    #
    # RE-RUN 3 — SEAT MATRIX:
    #   +0 starts=P0   P0 1:P1 3  ->  P0 3:P1 1
    #   +0 starts=P1   P0 1:P1 3  ->  P0 1:P1 3
    #   +1 starts=P0   P0 0:P1 14 ->  P0 9:P1 5
    #   +1 starts=P1   P0 4:P1 10 ->  P0 8:P1 6
    #   ★★ THE MIRROR CELL NOW SHOWS A CLEAN, SYMMETRIC FIRST-MOVER ADVANTAGE. Before, P1 won
    #     3/4 REGARDLESS of who started (a seat effect). Now WHOEVER MOVES FIRST wins 3/4, from
    #     either seat. The seat bias is gone and an ordinary turn-order advantage is what remains.
    #   ⇒ THIS IS WHERE THE USER'S FIRST-TURN AP REDUCTION BECOMES THE RIGHT TOOL. It was the
    #     wrong remedy while the seat bias dominated (turn order then contributed nothing, and
    #     moving first was if anything a slight DISADVANTAGE). With the tie-break fixed, the
    #     residual asymmetry in a perfectly symmetric match is EXACTLY a first-move advantage.
    #   ⚠ n=4 per mirror condition — symmetric across both, which is encouraging, but wants more
    #     openings before a VALUE is chosen. MIRROR_OPENINGS caps that cell at 4.
    #
    # ⚠ RESIDUAL, STATED PLAINLY: the +1 cell still leans P0/west (9/14 and 8/14, ~60/40) where
    #   fair is 7/7. Large improvement on 14/0, but not zero. Unmeasured candidates:
    #     - BaseProduction.legal_deploy_tiles ALSO uses _neighbors_in_fixed_order, so
    #       deploy-tile choice for produced units is still enumeration-ordered
    #     - the map is 10 tall with both HQs on rank 5 (5 north, 4 south), so "prefer smaller y"
    #       has marginally more room north — shared between seats, but not neutral
    # Suite 1260/1260 (+7). Slice boots clean. New suite pins the violated property: whatever a
    # west-based unit prefers, an east-based unit must prefer the MIRROR IMAGE of it.

