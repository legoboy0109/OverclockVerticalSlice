    # ✅ 5b28d99. USER DECISION 2026-08-25. Build was a PLAYER-level command (CR-5): any tile
    # beside any entity you owned was legal, no unit involved, entry point a persistent HUD button.
    # It is now A VERB OF A SELECTED BUILDER UNIT.
    # ⚠ BY THE INTAKE RULE ADOPTED 2026-08-26 THIS SHOULD HAVE GONE TO post-gate-backlog.md —
    #   it did not block the measurement, and it CHANGES THE ECONOMY THE PENDING VERDICT IS ABOUT.
    #   ★ NOT BEING REVERSED (user's call, and the game is better for it). Recorded because the
    #     call was framed as "should Build work this way" rather than "should this happen NOW".
    # WHAT CHANGED:
    # - New Builder unit. HQ produces ONLY Builders; the Scout moved to the Barracks, now the SOLE
    #   source of every fighting unit. The opening is therefore FIXED: make a Builder, walk it out,
    #   spend it on a Barracks, THEN field an army.
    # - Build tiles are neighbours of the ACTING Builder, never of the player's entities at large
    #   (else you could raise a building beside a builder standing somewhere else).
    #   legal_build_tiles_for(builder) is the rule; the player-wide union survives ONLY as "could
    #   this player build anywhere?" for menu greying and the AI's affordability gate, and MUST
    #   NOT validate a commit.
    # - ★ THE BUILDER IS CONSUMED by what it raises, so its cost is a PERMANENT SURCHARGE ON EVERY
    #   BUILDING rather than the price of a unit you keep. Destroy happens LAST, after the
    #   structure is placed, so a mid-apply failure cannot leave a player who has paid with no
    #   Builder and no building. Its destruction events are APPENDED, not discarded — otherwise
    #   the sprite stands beside the building it became and the population counter never learns.
