    # ✅ DONE (0637581). The project's biggest open design question is ANSWERED WITH EVIDENCE,
    # and the answer is that the question was built on a measurement artifact.
    # ★★ simulate_matches.gd drives BOTH SEATS with the same AI.choose_action and the same
    #   weights, deterministically. There is NO SKILL DIFFERENTIAL ANYWHERE IN IT -- so neither
    #   side can outplay the other, and a comeback is BY DEFINITION the trailing player
    #   outplaying the leader. "Zero lead changes at +1" could only ever have been zero.
    #   ⇒ Equal play from a worse position losing every time is ARITHMETIC, not a design
    #     property. The harness was asked a question it structurally could not answer.
    # Method: with probability p per turn the FAVOURED side commits at most one action instead
    # of playing its turn out ("played a worse turn", not "did not show up"). Deterministic
    # hash(game, turn) draw, never randi(). Default 0 is byte-identical to the shipped batch,
    # verified by diff. Variant offsets became a table so the cell could widen n=6 -> n=14.
    # RESULT (+1 handicap, n=14 per row):
    #   leader degraded   games w/ lead change   mean doubt   underdog wins
    #        0%                  0/14                3%           0/14
    #       15%                  4/14               22%           1/14
    #       35%                  8/14               40%           4/14
    #       50%                 12/14               66%           6/14
    # ⇒ A SKILL ROUTE BACK EXISTS. At equal play the advantage converts every time; at ANY
    #   play gap it stops being certain.
    # ⇒ NO COMEBACK MECHANIC IS NEEDED, and adding one would contradict game-concept.md for
    #   nothing -- the drama was there and unmeasurable. ★ The correct fix for "the measurement
    #   says no recoverable middle" was to fix the measurement.
    # ⚠ WHAT IT DOES NOT ESTABLISH: a one-action cap is a proxy for skill, not skill (a weaker
    #   human does the WRONG thing, not LESS); n=14 so the middle of the sweep is directional;
    #   both sides are still the same greedy one-ply scorer, so a human differs IN KIND.
    # ★ FIRST PASS RAN AT n=6 and showed a non-monotone dip that looked like a threshold
    #   effect. It was sample noise. n was raised BEFORE any conclusion was drawn.
    # ⚠ THE SAME CAVEAT NOW APPLIES TO s6-06: 18/18 handicap conversion is what a
    #   symmetric-policy harness MUST produce. It is not evidence the advantage is correctly
    #   SIZED. Gate re-verified after the harness change and unchanged: 18/22 resolve by HQ
    #   destruction (mean 29 turns), 4 mirror games at the 60-turn round cap, 18/18 conversion,
    #   seats P0 10 / P1 12, lowest HQ 1/40, 709 damage-carrying rows.
    # ⛔ WHAT REMAINS IS A TUNING QUESTION FOR THE USER, not a structural one: one Trooper is
    #   worth roughly 30-35% of decision quality. Is a one-unit lead meant to be that strong?

  - id: "s7-10"
    name: "★ Make a one-unit lead less punishing — HQ production cooldown 3 → 2"
    file: "production/playtests/s7-10-cliff-tuning-2026-08-25.md"
    priority: must-have
