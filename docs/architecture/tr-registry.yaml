  - { id: TR-hud-002, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0004, created: 2026-07-23, revised: "", status: active,
      requirement: "Coalesce dirty state to <=1 redraw/frame regardless of event count (N-hit kill -> 1 redraw)" }
  - { id: TR-hud-003, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Read-only facade (GameStateReader getters-only), not convention; facade + lint (no compile-time modifiers in Godot)" }
  - { id: TR-hud-004, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Bind AP counter, turn/round indicator, End Turn, Build button, action log always-present during active turn" }
  - { id: TR-hud-005, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "AP counter reads current_ap/income, 4-state anim FSM (Committed-rest/Fill-flourish/Tick-down/Preview-echo); opponent AP muted" }
  - { id: TR-hud-006, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "On PlayerTurn/EndTurn transition, preview echo force-cleared before fill-flourish evaluates; closes one-frame race" }
  - { id: TR-hud-007, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "GameOver commit snaps in-flight AP tick to final within one-frame; killing hp-pip drain plays unclipped non-gating" }
  - { id: TR-hud-008, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "AP tick relies on upstream INPUT_LOCK_MS>=AP_TICK_DURATION_MS, no own tick queue; cross-system coupling w/ Cmd interface" }
  - { id: TR-hud-009, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Turn/round indicator + YOUR/ENEMY banner reads active_player/round_number/match_status, self-clearing TURN_BANNER_DURATION_MS" }
  - { id: TR-hud-010, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0013, created: 2026-07-23, revised: "", status: active,
      requirement: "ISO: on-board glyph layer (hp pips, has-acted, tech marker, structure hp, build badge, research marker) anchored per-entity, reprojecting under iso" }
  - { id: TR-hud-011, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0013, created: 2026-07-23, revised: "", status: active,
      requirement: "Glyphs use fixed per-tile sub-positions + occlusion-priority (hp pips never occluded)" }
  - { id: TR-hud-012, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "hp display branch on PIP_MAX_HP (10, >=): discrete pips below, numeric cur/max at/above; no smooth bar" }
  - { id: TR-hud-013, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Detail panel subscribes outward-in to Cmd selection-changed signal (one-way #9->HUD), distinct pinned vs peek state" }
  - { id: TR-hud-014, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Action log append-only newest-on-top ring buffer (ACTION_LOG_LENGTH 20), one entry per apply_action, oldest dropped; deterministic order" }
  - { id: TR-hud-015, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Build button real-time affordability (dimmed never hidden), mirrors Cmd PREVIEW_BUILD pressed cue" }
  - { id: TR-hud-016, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Victory/defeat reads match_status=GameOver(winner)+win_condition, preempts turn banner within one frame" }
  - { id: TR-hud-017, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "End Turn + Build gated inert during opponent turn + EndTurn transient, readouts stay live; reads match_status/phase" }
  - { id: TR-hud-018, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Every HUD value live verbatim read, zero local balance constants, zero recompute (exempt transient anim delta)" }
  - { id: TR-hud-019, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "AP & Credits Economy exposes pre-computed Credits.credit_income_breakdown(player)->{base,outpost,econ_tech}, read live (not a stored income_this_turn snapshot)" }
  - { id: TR-hud-020, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Bind read-only to 7 upstream systems + coordination seam w/ Cmd, zero downstream dependents (leaf)" }
  - { id: TR-hud-021, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0016, created: 2026-07-23, revised: "", status: active,
      requirement: "Audio single-owner play() per event; total priority GameOver>turn stinger>completion(deduped)>AP-fill; duck HUD_AUDIO_DUCK_MS except GameOver hard-cut" }
  - { id: TR-hud-022, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0014, created: 2026-07-23, revised: "", status: active,
      requirement: "ENGINE RISK: HUD controls reachable via click + keyboard/gamepad focus, dual-focus grab_click_focus()/grab_focus() + distinct focus/hover StyleBox; inert=FOCUS_NONE" }
  - { id: TR-hud-023, system: hud, gdd: design/gdd/game-hud.md, adr: ADR-0004, created: 2026-07-23, revised: "", status: active,
      requirement: "Event-driven (signal-subscribed) not per-_process polling; ~6 glyph classes/entity; dirty-flag coalescing" }

  # ============================ AI Opponent (17) ============================
  - { id: TR-ai-001, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "AI operates on headless render-decoupled clone(); no rendering dep; evaluate clone, commit real" }
  - { id: TR-ai-002, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "AI acts only as second active_player in own Action phase, identical rules" }
  - { id: TR-ai-003, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Decision loop iterative evaluate->commit: clone->enumerate all legal/affordable across verbs->score->commit best via apply_action->re-clone->repeat" }
  - { id: TR-ai-004, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Enumerate via reachable(), legal_targets()/hypothetical+preview_damage(), legal_build_tiles/legal_deploy_tiles/completed_outpost_count, legal_research_targets" }
  - { id: TR-ai-005, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Every candidate through DUAL afford gate (ap_can_afford AND credits_can_afford) + costed via ap_equiv_cost = ap_cost + credit_cost*CREDIT_TO_AP_RATE before scoring; no discount" }
  - { id: TR-ai-006, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Single normalized action_score(action) -> AP-equivalent value/cost (Credit-denominated value+cost terms converted via CREDIT_TO_AP_RATE), post-hoc lethal floor override; verb-dispatch, data-driven no hardcoded priority" }
  - { id: TR-ai-007, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "All scoring weights external tunable (16 knobs: HP_PER_AP, KILL_DENIAL_RATE, ECONOMY_HORIZON, LETHAL_FLOOR_BONUS, PASS_THRESHOLD, CREDIT_TO_AP_RATE, etc.)" }
  - { id: TR-ai-008, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Enforce/validate LETHAL_FLOOR_BONUS > economy_ceiling_score * CREDIT_TO_AP_RATE cross-knob invariant (holds <= rate ~1.98 at default floor); needs startup assertion (no AC automates - QQ-07)" }
  - { id: TR-ai-009, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Loop termination guaranteed: no legal action, best<=PASS_THRESHOLD, or own commit->GameOver; bounded iterations" }
  - { id: TR-ai-010, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Handle apply_action() rejection defensively: discard clone, re-loop fresh, spend 0, no crash" }
  - { id: TR-ai-011, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0003, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Deterministic selection: no engine RNG; ties (<SCORE_TIE_EPSILON) -> lowest ap_equiv_cost then lowest entity ID (unique integer final key)" }
  - { id: TR-ai-012, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Perf budget for evaluate->commit loop OPEN (~O(N^2*W*H), N<=24 on 14x16); turn wall-clock 3000ms OR per-commit 400ms spike-gated (QQ-06)" }
  - { id: TR-ai-013, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "AI-committed actions render incrementally one commit at a time, not silent batch; commit loop yields/streams" }
  - { id: TR-ai-014, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Query-call instrumentation seam to verify reads route exclusively through approved query set; DI query facade" }
  - { id: TR-ai-015, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Field-level diff harness AI vs human apply_action results, named fields only (position/hp/current_ap/existence); excludes entity-id counters" }
  - { id: TR-ai-016, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Seeded fixture + fuzz corpus (>=20 boards, >=500 fuzzed, fixed seed) verifying current_ap never negative" }
  - { id: TR-ai-017, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-07-23, revised: "", status: active,
      requirement: "Consume Grid manhattan_distance/terrain_at/occupant_at for positional/retreat scoring normalized by tiles-traversed; nearest-live-enemy + one-step lookahead" }
  - { id: TR-ai-018, system: ai, gdd: design/gdd/ai-opponent.md, adr: ADR-0011, created: 2026-08-05, revised: "", status: active,
      requirement: "CREDIT_TO_AP_RATE (default 1.0, range 0.5-2.0, AI-only) converts Credit-denominated costs/values to AP-equivalent so the single-axis score holds; anchors ap_equiv_cost + the dual-pool affordability gate; the AIConfig's 16th knob (two-currency pivot)" }

  # ============================ Faction Identity (15) ============================
  - { id: TR-faction-001, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "FactionDef as statically-typed data-only Resource, loaded at setup; lint asserts no logic methods" }
  - { id: TR-faction-002, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Schema exposes exactly 6 CR-2 domains, reject load if field outside closed set; hard contract" }
  - { id: TR-faction-003, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "effective_produce_cost/effective_move_cost/effective_soft_move_cap in Unit read sites, fold faction delta, floors max(1,..)/max(MIN_MOVE_COST,..)" }
  - { id: TR-faction-004, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "effective_credit_income(player) folds Delta base/tier1/tier2 into the 4-term Credit income formula, floored BASE_INCOME_FLOOR; preserves econ-tech term + cap" }
  - { id: TR-faction-005, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "effective_build_cost/build_time/production_cap in B&P read sites, floors max(1,..)/max(MIN_BUILD_TIME,..)/dual-floor cap" }
  - { id: TR-faction-006, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "effective_production_cap two-sided inert invariant: base>=1->clamp max(1,base+Delta); base==0->always 0; branch on base_cap sign not single clamp" }
  - { id: TR-faction-007, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "effective_research_cost/research_time/tech_available(faction_allows) in Research read sites, floors + boolean AND-gate into legal-research-target filter" }
  - { id: TR-faction-008, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Turn Manager persists faction_of(player) full match, set at SELECTING->ASSIGNED, immutable (LOCKED Setup->PlayerTurn); clone() deep-copies faction" }
  - { id: TR-faction-009, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Turn Manager applies starting_loadout once at SELECTING->ASSIGNED before Setup->PlayerTurn; setup-time placement validation" }
  - { id: TR-faction-010, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "SELECTING sub-state between UNASSIGNED and ASSIGNED, re-highlight-without-commit preview + acknowledgment-gated confirm for non-Neutral" }
  - { id: TR-faction-011, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Zero behavior change when all deltas 0 (Neutral): effective_X(base,player)==base_X exactly; parametrized regression test" }
  - { id: TR-faction-012, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Orphaned deltas (key no longer in base roster) silently ignored/inert + load-time schema warning; orphaned loadout vs orphaned numeric delta" }
  - { id: TR-faction-013, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Schema declares faction_hue + reserved non-hue faction_pattern_id, both non-empty on every FactionDef; colorblind fallback" }
  - { id: TR-faction-014, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "Faction-selection UI (setup picker + campaign config) showing 3 VS FactionDefs, default Neutral, acknowledgment-gated non-Neutral, preview loadout before lock" }
  - { id: TR-faction-015, system: faction, gdd: design/gdd/faction-identity.md, adr: ADR-0012, created: 2026-07-23, revised: "", status: active,
      requirement: "AI reads effective_X via same shared call sites, no AI-only branch; future AI cost-cache key includes player" }
