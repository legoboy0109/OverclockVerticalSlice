  # ============================ AP Economy (14) ============================
  - { id: TR-apecon-001, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "current_ap (AP tactical pool) int per-player, 2 writers: turn reset (flat+capped carry) + AP.spend(); current_credits (Credit economic pool, banked >=0) int per-player, 3 writers: start-of-turn income add + Credits.spend() + Credits.credit() (cancel refund)" }
  - { id: TR-apecon-002, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "credit_income(player)->int per tiered formula (BASE + tier1*min(n,THRESH) + tier2*max(0,n-THRESH) + econ-tech term), n=max(0,outposts) — same shape as former ap_income, now funds the Credits pool" }
  - { id: TR-apecon-003, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Externalize coefficients in EconomyConfig (10 fields): BASE_INCOME=10, OUTPOST_BONUS_TIER1=2, TIER2=1, TIER_THRESHOLD=4, ECONOMY_TECH_TIER_THRESHOLD=6, ECONOMY_TECH_INCOME_BONUS=1 (Research-owned), FLAT_AP_PER_TURN=10, AP_CARRYOVER_CAP=5, PRODUCE_AP_COST=1, BUILD_AP_COST=2, RESEARCH_AP_COST=1; no literals in code" }
  - { id: TR-apecon-004, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0008, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Start-of-turn (ADR-0008): step 4a AP.reset_turn (current_ap := FLAT_AP_PER_TURN + min(leftover, AP_CARRYOVER_CAP), overwrite); step 4b Credits.add_income (bank credit_income, AFTER the build-timer advance); income_this_turn snapshot RETIRED" }
  - { id: TR-apecon-005, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "End of turn: NO AP discard — unspent AP carries (capped at AP_CARRYOVER_CAP, consumed by next reset); Credits bank indefinitely (no cap); both pools immutable through opponent turn" }
  - { id: TR-apecon-006, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "ap_can_afford + credits_can_afford (player,amount)->bool pure, callable for any player; all spenders call the relevant pool(s) before offering an action" }
  - { id: TR-apecon-007, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "ap_spend + credits_spend (player,amount)->bool sole atomic mutators per pool (reject if not active, <0, >current; no-op if 0); Credits.credit is the cancel-refund writer; sole cross-system writes" }
  - { id: TR-apecon-008, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Invariants hold structurally: 0<=current_ap<=FLAT_AP_PER_TURN+AP_CARRYOVER_CAP (max 15); current_credits>=0 (unbounded above)" }
  - { id: TR-apecon-009, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Read queries current_ap + current_credits + credit_income_breakdown (base/outpost/econ_tech) for HUD + Cmd interface; LIVE read (equals start-of-turn value within a turn — not a stored snapshot)" }
  - { id: TR-apecon-010, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "", status: active,
      requirement: "Read completed_outpost_count(player) + has_economy_tech(player) as external deps (Base&Prod + Research); pure/deterministic" }
  - { id: TR-apecon-011, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Move/Attack integrate via ap_spend/ap_can_afford; economic actions (produce/build/research) are DUAL-COST (Credits main + AP surcharge) both-or-neither; two bounded budgets are the deliberate model (Pillar 1 = 'Every Choice Is a Tradeoff', not a sprawl of parallel currencies)" }
  - { id: TR-apecon-012, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0012, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Additive Faction income modifier fold-in into effective_credit_income (Delta base/tier1/tier2) gated by BASE_INCOME_FLOOR; no-op under Neutral" }
  - { id: TR-apecon-013, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0003, created: 2026-07-23, revised: "2026-08-05", status: active,
      requirement: "Full determinism: identical income+actions -> bit-identical AP + Credit trajectories, no RNG" }
  - { id: TR-apecon-014, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-07-23, revised: "", status: active,
      requirement: "Test doubles for completed_outpost_count + has_economy_tech (DI over singletons)" }
  - { id: TR-apecon-015, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-08-05, revised: "", status: active,
      requirement: "Dual-cost economic actions (produce/build/research): legal iff credits_can_afford(credit_cost) AND ap_can_afford(ap_surcharge); apply spends BOTH (both-or-neither); enforced by ADR-0002 validate-before-mutate, no rollback object" }
  - { id: TR-apecon-016, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-08-05, revised: "", status: active,
      requirement: "AP carryover: unspent AP carries into next turn capped at AP_CARRYOVER_CAP (5); Credits accumulate uncapped across turns (banked war chest, no discard)" }
  - { id: TR-apecon-017, system: apecon, gdd: design/gdd/ap-economy.md, adr: ADR-0006, created: 2026-08-05, revised: "", status: active,
      requirement: "AP logistics surcharges PRODUCE_AP_COST/BUILD_AP_COST/RESEARCH_AP_COST owned by EconomyConfig (economy-owned), read cross-system by B&P/Research; research surcharge per-tech-overridable via TechDef.ap_surcharge" }

