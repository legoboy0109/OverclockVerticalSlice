# ─── API DECISIONS ───────────────────────────────────────────────────────────
# Which engine APIs are chosen for which purpose across the project.
# Conflicts: two ADRs using different APIs for the same purpose = inconsistent
# implementation that breaks when one system expects the other's API.
#
# Register an API decision when the choice is non-obvious and other ADRs might
# make a different choice for the same purpose without knowing this was decided.

api_decisions:
  - purpose: game_state_deep_copy
    status: active
    api: Resource.duplicate_deep()
    not: "hand-written clone() / duplicate(true)"   # explicitly banned for state cloning
    adr: docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    reason: "Engine-native recursive deep copy of nested Resources (default DEEP_DUPLICATE_INTERNAL mode duplicates path-less runtime Resources inside Dictionaries/Arrays). Requires every state field be storage-flagged (@export or PROPERTY_USAGE_STORAGE)."
    referenced_by:
      - docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    added: 2026-07-23
    revised: ""

  - purpose: game_state_base_class
    status: active
    api: "extends Resource (constructed at runtime via .new() only, never loaded from disk)"
