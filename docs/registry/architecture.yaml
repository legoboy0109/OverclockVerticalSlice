    api: "Three-part shape: (1) GameStateReader (class_name ... extends RefCounted) — an injected READ-ONLY facade wrapping GameState, exposing GETTERS ONLY (no apply_action, no setter reachable), so 'HUD never mutates state' is STRUCTURAL (a write path does not exist on the object HUD scripts hold), not review-enforced (TR-hud-003). (2) ApCounterFsm (class_name ... extends RefCounted) — a PURE headless animation-state core: enum State{COMMITTED, FILL_FLOURISH, TICK_DOWN, PREVIEW_ECHO} + pure next_state(current, trigger)->State, making AC-3a/4/5a/25 headless-testable (mirrors CommandFSM). (3) HudAudioDispatcher — the SOLE code-level play() chokepoint for every HUD audio event, resolving a single total priority order (GameOver > turn-stinger > completion[deduped] > AP-fill) with ducking; it OWNS the play() calls but may manage >=2 AudioStreamPlayer children under the hood (one player plays one stream; true ducking needs >=2 players/bus sends). HUD is a reactive Control tree using queue_redraw() (native same-frame coalescing) not a _process dirty-flag poll. New HUDConfig (Resource, 9 knobs) via gameplay_config_storage."
