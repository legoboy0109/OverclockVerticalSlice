# ─── INTERFACE CONTRACTS ──────────────────────────────────────────────────────
# How systems are required to communicate with each other.
# Conflicts: one ADR expects signal, another expects direct call = integration bug.
#
# Register a contract when the communication pattern between two systems is
# explicitly decided in an ADR and other systems must follow the same pattern.
#
# pattern options: signal | direct_call | event_bus | shared_resource | rpc | none

interfaces:
  - contract: action_result
    status: active
    pattern: direct_call
    producer: game-state-turn-manager   # apply_action returns it
    consumers:
      - command-action-interface   # reads ok/reason to accept/reject a commit
      - ai-opponent                # reads ok/reason during evaluate-commit loop
      - game-hud                   # reads events to drive AP tick, hp drain, action-log
    adr: docs/architecture/adr-0002-apply-action-command-model.md
    signal_signature: "apply_action(action: Action) -> ActionResult { ok: bool, reason: int (Reason enum), events: Array[Event] }"
    referenced_by:
      - docs/architecture/adr-0002-apply-action-command-model.md
      - docs/architecture/adr-0011-ai-opponent-decision-loop.md   # AITurnDriver reads result.ok to handle rejection (AC-24) + result.events stream
      - docs/architecture/adr-0015-command-action-interface-fsm.md   # Tier-4: reads ActionResult.ok after every commit; on reject swallows, re-issues Tier-1, stays in menu, spends 0 (never re-validates legality itself)
      - docs/architecture/adr-0016-game-hud.md   # reads ActionResult.events as the action-log source — one log entry per event, in the events' append order (deterministic resolution order, ADR-0004)
    added: 2026-07-23
    revised: 2026-07-24

  - contract: verb_handler
    status: active
    pattern: direct_call
    producer: game-state-turn-manager   # apply_action dispatches to handlers by verb enum
    consumers:
      - movement-system            # supplies MoveAction validate/apply
      - combat-resolution          # supplies AttackAction validate/apply
      - base-production            # supplies Build/Produce/CancelBuild validate/apply
      - research-tech              # supplies Research validate/apply
    adr: docs/architecture/adr-0002-apply-action-command-model.md
    signal_signature: "validate(state: GameState, action: Action) -> int (Reason; PURE, total); apply(state: GameState, action: Action) -> Array[Event] (assumes validated; may not fail). Dispatched via action.verb enum through a Dictionary[int, Callable]."
    referenced_by:
      - docs/architecture/adr-0002-apply-action-command-model.md
      - docs/architecture/adr-0009-reachable-search-pathfinding.md   # supplies MoveAction validate()/apply()
      - docs/architecture/adr-0010-combat-resolution-destruction-wincheck.md   # supplies AttackAction validate()/apply()
      - docs/architecture/adr-0011-ai-opponent-decision-loop.md   # AI constructs typed Action subclasses; AITurnDriver commits them through the same dispatch
      - docs/architecture/adr-0015-command-action-interface-fsm.md   # constructs typed Move/Attack/Build/Produce/CancelBuild/EndTurn Actions on commit and dispatches them through apply_action (the sole commit vector; UI never mutates state)
      - docs/architecture/adr-0017-base-production-mechanics.md   # concretely defines BaseProduction.validate_build/apply_build, validate_produce/apply_produce, validate_cancel/apply_cancel (the Build/Produce/CancelBuild handler bodies dispatched here)
      - docs/architecture/adr-0018-research-tech-mechanics.md   # concretely defines Research.validate_start_research/apply_start_research, validate_cancel_research/apply_cancel_research (the StartResearch/CancelResearch handler bodies dispatched here)
    added: 2026-07-23
    revised: 2026-07-24

  - contract: ap_query_spend
    status: active
    pattern: direct_call
    producer: ap-economy   # static AP class — income()/can_afford()/spend()
    consumers:
      - command-action-interface   # can_afford/income drive affordability highlighting + previews
      - ai-opponent                # can_afford/current_ap/income gate every candidate action it scores
      - game-hud                   # current_ap/income/income breakdown display
      - movement-system            # spend() for move cost, inside apply()
      - combat-resolution          # spend() for attack cost, inside apply()
      - base-production            # spend() for build/produce cost, inside apply()
      - research-tech              # spend() for research cost, inside apply()
    adr: docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
    signal_signature: "income(state, player) -> int [pure]; can_afford(state, player, amount) -> bool [pure]; spend(state, player, amount) -> bool [sole mutator, active-player-gated, called only inside a verb handler's apply()]"
    referenced_by:
      - docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
      - docs/architecture/adr-0010-combat-resolution-destruction-wincheck.md   # spend(attack_cost | DEFENSIVE_ATTACK_COST) inside Combat.apply()
      - docs/architecture/adr-0011-ai-opponent-decision-loop.md   # can_afford/current_ap/income gate every candidate before scoring (no discount)
      - docs/architecture/adr-0015-command-action-interface-fsm.md   # can_afford gates every menu verb (D-2); current_ap drives projected_remaining_ap (D-1); UI NEVER deducts (spend() runs inside each verb handler's apply())
      - docs/architecture/adr-0016-game-hud.md   # HUD reads current_ap (AP counter, opponent-AP muted) + can_afford (Build-button affordability) via GameStateReader; income breakdown uses the forward-declared ap_income_breakdown (separate contract), never a HUD-side sum
      - docs/architecture/adr-0018-research-tech-mechanics.md   # spend(research_cost) inside Research.apply_start_research(); cancel credits the reused cancel_refund_pct
    added: 2026-07-23
    revised: 2026-07-24

  - contract: completed_outpost_count
    status: active
    pattern: direct_call
    producer: base-production   # forward-declared — concrete implementation owed by ADR-0007
    consumers:
      - ap-economy                 # AP.income() calls this for the n term
    adr: docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
    signal_signature: "completed_outpost_count(state: GameState, player: int) -> int — count of the player's alive, owned, completed Economy Outposts (HQ/Production Outposts/Defensive Structures excluded). Forward-declared by ADR-0006; implemented by ADR-0007."
    referenced_by:
      - docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
      - docs/architecture/adr-0007-entity-stat-schema.md   # concrete implementation (iterates entities() filtering type == ECONOMY_OUTPOST + COMPLETED)
    added: 2026-07-23
    revised: 2026-07-23

  - contract: economy_tech_income_bonus
    status: active
    pattern: direct_call
    producer: research-tech   # forward-declared — concrete implementation owed by ADR-0007
    consumers:
      - ap-economy                 # AP.income() calls this when has_economy_tech is set
    adr: docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
    signal_signature: "economy_tech_income_bonus(state: GameState, player: int) -> int — the per-outpost AP value of Research's Economy Tech effect (ECONOMY_TECH_INCOME_BONUS, Research-owned constant). Forward-declared by ADR-0006; implemented by ADR-0007. Reads Research.has_economy_tech(state, player) (the gate flag owned by ADR-0018, state_ownership: player_tech_unlocks). ECONOMY_TECH_TIER_THRESHOLD (the cap) is AP Economy's own EconomyConfig field, not part of this contract."
    referenced_by:
      - docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
      - docs/architecture/adr-0007-entity-stat-schema.md   # concrete implementation (has_economy_tech gate + INCOME_BONUS × min(count, TIER_THRESHOLD))
      - docs/architecture/adr-0018-research-tech-mechanics.md   # provides the has_economy_tech gate flag this reads
    added: 2026-07-23
    revised: "2026-07-24"

  - contract: state_change_signal
    status: active
    pattern: signal
    producer: game-state-turn-manager   # GameState emits its own signal (no separate bus Autoload)
    consumers:
      - game-hud                   # AP tick, hp-pip drain, action-log append, dirty-flag coalescing
      - board-renderer             # sprite move, depth re-sort
      - game-hud                   # audio single-owner subscribes to the same commit signal (TR-hud-021/231)
    adr: docs/architecture/adr-0004-event-signal-architecture.md
    signal_signature: "signal action_applied(result: ActionResult) — emitted once, synchronously, at apply_action step 7, ONLY when result.ok == true. Payload carries the typed events: Array[Event] from ADR-0002. Per-commit coalescing is automatic (one signal, N typed events); subscribers narrow via `if e is SomeEvent:`. A fired signal always means state actually changed. Rejected actions do not emit — callers read result from the direct apply_action() return. Resolves QQ-02 (supersedes its state_changed / per-category-signal candidates). ADR-0008 adds StructureCompletedEvent + TechCompletedEvent to the Event payload (emitted by EndTurnAction via this same signal, since EndTurnAction dispatches through apply_action)."
    referenced_by:
      - docs/architecture/adr-0004-event-signal-architecture.md
      - docs/architecture/adr-0008-start-of-turn-sequencing.md   # StructureCompletedEvent/TechCompletedEvent ride this signal via EndTurnAction
      - docs/architecture/adr-0013-isometric-board-rendering.md   # BoardRenderer subscribes to know WHEN to redraw (sprite move, depth re-sort), never polling
      - docs/architecture/adr-0015-command-action-interface-fsm.md   # CommandInterface subscribes for: (1) commit-flash — fired off THIS single signal, the SAME event Game HUD's AP-tick (ADR-0016) subscribes to, so both animate on one frame (TR-cmdui-023, the named top desync risk); (2) board-change Tier-1 re-issue of reachable()/legal_targets(); (3) GAME_OVER observation by BOTH players' interface instances (committing or not)
      - docs/architecture/adr-0016-game-hud.md   # HUD subscribes for the AP-tick (visual + the single-owner audio via HudAudioDispatcher), hp-pip drain, and action-log append (one entry per result.events element); the SAME signal #9's commit-flash rides (one-frame flash<->tick sync)
    added: 2026-07-23
    revised: 2026-07-24

  - contract: turn_start_sequence
    status: active
    pattern: direct_call
    producer: game-state-turn-manager   # GameState.start_turn() orchestrates the canonical 4-step order
    consumers:
      - ap-economy                 # AP.reset_turn() is step 4 (income snapshot)
      - base-production            # advance_build_timers() is part of step 3
      - research-tech              # advance_research_timers() is part of step 3
      - unit-system                # reset_turn_flags() is step 2
    adr: docs/architecture/adr-0008-start-of-turn-sequencing.md
    signal_signature: "GameState.start_turn(player: int) -> Array[Event] — the canonical fixed 4-step start-of-turn sequence: (1) set active_player, (2) reset per-turn flags for the player's entities (Unit/Structure.reset_turn_flags), (3) advance build + research timers (BaseProduction/Research.advance_*_timers, completing structures/techs), (4) AP.reset_turn() income snapshot. Called by start_match() for the first turn and by EndTurnAction.apply() (after AP.discard + round_number increment) each subsequent turn. Step order is fixed — step 4 MUST follow step 3 (see forbidden: start_of_turn_step_reordering)."
    referenced_by:
      - docs/architecture/adr-0008-start-of-turn-sequencing.md
      - docs/architecture/adr-0016-game-hud.md   # HUD drives the AP-counter fill-flourish + turn-change stinger off the start-of-turn signal; completion cues fire on the Structure/TechCompletedEvents this sequence emits (step 3)
    added: 2026-07-23
    revised: 2026-07-24

  - contract: build_timer_advance
    status: active
    pattern: direct_call
    producer: base-production   # forward-declared by ADR-0008 — concrete body defined by ADR-0017
    consumers:
      - game-state-turn-manager    # start_turn() step 3 calls it
    adr: docs/architecture/adr-0008-start-of-turn-sequencing.md
    signal_signature: "BaseProduction.advance_build_timers(state: GameState, player: int) -> Array[Event] — decrements build_turns_remaining on the player's Under-Construction structures; transitions any reaching 0 to StructureState.BuildStatus.COMPLETED, appending one StructureCompletedEvent per completion. Forward-declared by ADR-0008; concrete body defined by ADR-0017 (the B&P mechanics ADR — supersedes the earlier 'no dedicated ADR' note; ADR-0008 still owns WHEN it runs, step 3)."
    referenced_by:
      - docs/architecture/adr-0008-start-of-turn-sequencing.md
      - docs/architecture/adr-0017-base-production-mechanics.md   # defines advance_build_timers body (D1); ADR-0008 sequences it at start-of-turn step 3
    added: 2026-07-23
    revised: "2026-07-24"

  - contract: research_timer_advance
    status: active
    pattern: direct_call
    producer: research-tech   # forward-declared by ADR-0008 — concrete body defined by ADR-0018
