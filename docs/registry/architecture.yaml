  - purpose: faction_modifier_framework
    status: active
    api: "A faction is a data-only FactionDef (extends Resource, CR-1 — @export data only, no _process/logic) declaring exactly the closed 6-domain CR-2 modifier set. Per-entity deltas are TYPED Array[FactionUnitDelta]/[FactionStructureDelta]/[FactionTechDelta] entry sub-resources (each {type/tech: <TypeDef Resource ref>, ...int deltas}), NOT Resource-keyed Dictionaries. FactionDefs are preload'd into a Factions registry Autoload as consts (Factions.NEUTRAL/RUSH/BOOM); identity by Resource-reference (== Factions.RUSH), reusing entity_stat_template_storage (ADR-0007) — so a FactionDef is SHARED (not deep-copied) on GameState.clone() at zero cost, and PlayerState.faction survives clone() by reference. Faction is a MODIFIER PROVIDER: each owning system exposes effective_X(state, base_owner, player) that folds the acting player's faction delta at its OWN read site (see interfaces: faction_effective_values), floored per domain; Faction owns no base value. A static Faction helper (RefCounted) centralizes the roster-sized entry scan + orphan-inertness (null/absent -> 0). PlayerState gains a faction: FactionDef field (Setup-locked, immutable after Setup->PlayerTurn, same lock as is_ai_controlled)."
    not: "a central Faction.effective_X that computes every domain itself (would read/own base values from 5 systems, breaking CR-4 'modifier provider never owns base values') / enum FactionKind + const Dictionary of hardcoded deltas (violates data-driven standard; loses inspector authoring + clone-sharing; parallels the enum ADR-0007 rejected) / Resource-object-keyed Dictionary delta tables (untyped violates typed-collections standard; Resource keys are a fragile .tres/inspector-authoring corner - godot-specialist 2026-07-24) / a single symmetric max(0,base+delta) production_cap clamp (fails the two-sided inert invariant TR-faction-006) / mutating base registry values (CR-4 forbids; base is read-only)"
    adr: docs/architecture/adr-0012-faction-identity-modifier-framework.md
    reason: "Framework-only scope matching the GDD (Rush/Boom asymmetry values prototype-gated; VS ships Neutral where every delta is identity so effective_X == base_X EXACTLY - zero corpus behavior change, TR-faction-011). Reuses entity_stat_template_storage (ADR-0007) so faction data is shared-not-copied on the AI clone path. The effective_X-folds-at-owning-read-site pattern extends ADR-0010's effective_attack (base + research + faction) rather than adding a parallel resolution site, so every consumer (preview/HUD/AI/Combat) reads ONE effective_X per domain and the AI plays any faction correctly-costed with zero AI code change (every effective_X takes player). Typed entry-array authoring (chosen over Resource-keyed dicts) keeps Resource-ref identity while being fully typed + cleanly inspector-authorable."
    referenced_by:
      - docs/architecture/adr-0012-faction-identity-modifier-framework.md
    added: 2026-07-24
    revised: ""

  - purpose: base_production_module_shape
    status: active
    api: "class_name BaseProduction extends RefCounted — a stateless static utility (no instance ever on GameState) exposing pure functions over GameState: the queries legal_build_tiles/legal_deploy_tiles, the verb validate/apply pairs (validate_build/apply_build, validate_produce/apply_produce, validate_cancel/apply_cancel) dispatched by apply_action's verb-enum table (ADR-0002), the advance_build_timers body (sequenced by ADR-0008 step 3), and the effective_build_cost/effective_build_time/effective_production_cap folds (ADR-0012). Structure lifecycle is the 2-value StructureState.BuildStatus{UNDER_CONSTRUCTION, COMPLETED} (ADR-0007) + two terminal erasure exits: cancel_build (refund) and destroy_entity (ADR-0010, no refund). Occupancy is status-agnostic — build() inserts into the single Grid index (ADR-0005) regardless of BuildStatus, so blocking/targeting-while-building is inherited, no carve-out. Non-template constants live in BaseProductionConfig (.tres) via the Balance-style Autoload (gameplay_config_storage)."
    not: "a BaseProduction Node/Autoload holding build queues or a legal_build_tiles cache as instance state (would be deep-copied on every AI clone() and invites stale-cache bugs against a mutating board) / storing DESTROYED/REMOVED as a persisted BuildStatus enum value (see forbidden: stored_terminal_structure_state) / an intangible-under-construction occupancy carve-out"
    adr: docs/architecture/adr-0017-base-production-mechanics.md
    reason: "Mirrors ap_economy_module_shape / movement_search_module_shape / combat_module_shape / ai_module_shape exactly — the B&P rules (placement, produce, cancel, lifecycle transitions) are stateless static functions taking state explicitly, so identical code runs on the authoritative state and any AI clone(). Keeps GameState from re-accreting Core-system logic and keeps config off the clone path. legal_build_tiles uses a friendly-frontier candidate set (bounded by friendly-entity count) filtered by the strict->2 enemy standoff, recomputed live every call (never cached — matches base-production.md 'checked live, not cached'). godot-specialist 2026-07-24: shape + typed returns + sort_custom canonical ordering + integer fixed-point refund + Resource-ref in-membership all idiomatic 4.6, no blocking issues."
    referenced_by:
      - docs/architecture/adr-0017-base-production-mechanics.md
    added: 2026-07-24
    revised: ""

  - purpose: research_module_shape
    status: active
    api: "class_name Research extends RefCounted — a stateless static utility (no instance on GameState) exposing pure functions over GameState: queries legal_research_targets + has_attack_tech/has_defense_tech/has_economy_tech accessors; verb validate/apply pairs (validate_start_research/apply_start_research, validate_cancel_research/apply_cancel_research) dispatched by apply_action (ADR-0002); the advance_research_timers body (ADR-0008 step 3, SOLE writer of player_tech_unlocks flags, order-independent vs advance_build_timers); the on_lab_destroyed body (ADR-0010 destroy_entity hook); and the effective_research_cost/effective_research_time folds (ADR-0012). Tri-state tech status is DERIVED from PlayerState flags + Lab current_research_target (no stored table — see forbidden: stored_tech_status_table). NO new config Resource: research_cost/research_time + effect magnitudes live on TechDef templates (ADR-0007); cancel refund reuses BaseProductionConfig.cancel_refund_pct (ADR-0017); ECONOMY_TECH_TIER_THRESHOLD is AP-Economy-owned."
    not: "a Research Node/Autoload with instance state / a stored per-(player,tech) status table (see forbidden: stored_tech_status_table) / a data-driven completed_techs Array[TechDef] set on PlayerState (would contradict ADR-0008's registered advance_research_timers 'sets the flag' signature; VS tech tree is fixed at 3) / a dedicated ResearchConfig Resource (research constants are per-tech TechDef data, not flat config)"
    adr: docs/architecture/adr-0018-research-tech-mechanics.md
    reason: "Mirrors base_production_module_shape / ap_economy_module_shape / combat_module_shape exactly — the Research rules (tech selection, mutual exclusion, timer/completion, revert) are stateless static functions taking state explicitly, so identical code runs on the authoritative state and any AI clone(). Named bool flags match ADR-0008/0010's already-registered signatures; derived status keeps one source of truth and makes destruction-revert automatic. godot-specialist 2026-07-24: shape + nullable TechDef Resource-ref field with == identity + clean duplicate_deep() clone (null trivial; non-null preload'd TechDef stays SHARED per ADR-0007) + 3 @export bool PlayerState fields + cross-Resource cancel_refund_pct read all idiomatic 4.6, no blocking issues, no minor notes."
    referenced_by:
      - docs/architecture/adr-0018-research-tech-mechanics.md
    added: 2026-07-24
    revised: ""

# Example:
#
# api_decisions:
#   - purpose: physics_raycast
#     status: active
#     api: PhysicsServer3D.space_get_direct_state()
#     not: RayCast3D node     # explicitly banned for this purpose
#     adr: docs/architecture/adr-0002-physics-architecture.md
#     reason: "Direct server calls avoid per-frame node overhead; 3× faster in profiling"
#     referenced_by:
#       - docs/architecture/adr-0002-physics-architecture.md
#       - docs/architecture/adr-0003-combat-system.md
#     added: 2026-03-26
#     revised: ""


# ─── FORBIDDEN PATTERNS ──────────────────────────────────────────────────────
# Architecture anti-patterns explicitly banned by accepted ADRs.
# When writing a new ADR, check this list — if the proposed approach matches
# a forbidden pattern, it must be reworked before the ADR can be Accepted.
#
# Register a pattern when an ADR explicitly bans it AND other ADRs might
# unknowingly use it (i.e., it's a tempting but wrong approach for this project).

forbidden_patterns:
  - pattern: autoload_state_authority
    status: active
    description: "No Autoload may hold authoritative game state. The GameState instance is created by a match-bootstrap script and passed by reference (DI). The MatchService Autoload is a logic-free reference holder ONLY (get/set current GameState) — it must never mutate, validate, or interpret state, and unit tests + AI must not depend on it."
    why: "An Autoload models one live instance well, but the AI's clone()-based lookahead and headless tests need many independent simultaneous instances. Authority in an Autoload makes both structurally awkward and violates the DI-over-singletons coding standard."
    adr: docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    added: 2026-07-23

  - pattern: direct_game_state_field_write
    status: active
    description: "A system must never write GameState (or PlayerState/EntityState/GridState) fields directly. All mutation flows through GameState.apply_action(action), the sole mutation vector. Field-level write ownership (e.g. current_ap via AP Economy.spend, occupancy via Grid.place/remove/move) is enforced inside apply_action, not by callers reaching in."
    why: "Single mutation vector guarantees atomicity, validation, AP deduction, and win-check on every state change (full contract in ADR-0002). Direct writes create race conditions and break determinism + clone parity."
    adr: docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    added: 2026-07-23

  - pattern: get_class_verb_dispatch
    status: active
    description: "Never dispatch/route on Object.get_class() for GDScript-defined types. For a script class, get_class() returns the base ENGINE class name (e.g. 'RefCounted'), not the script class_name, so `match action.get_class()` silently never matches. Verb dispatch uses the action.verb enum through a Dictionary[int, Callable] (or `is`-type checks where a table is overkill)."
    why: "get_class()-based dispatch is a plausible-looking silent bug (godot-specialist, 2026-07-23). The verb-enum table is also faster than a linear is-chain as verb count grows."
    adr: docs/architecture/adr-0002-apply-action-command-model.md
    added: 2026-07-23

  - pattern: mutation_in_validate
    status: active
    description: "A verb handler's validate(state, action) must be PURE — it may read state but must never mutate it, and must check ALL failure conditions (including AP.can_afford). The paired apply(state, action) assumes validation passed and may not fail. Applies to every Core verb handler (Movement/Combat/Base&Prod/Research)."
    why: "Atomicity is achieved by validate-before-mutate with NO rollback (ADR-0002). If validate() mutates, or a precondition is checked only in apply(), an illegal action can leave partial state — breaking the 'illegal action => zero state change' guarantee (TR-gamestate-005)."
    adr: docs/architecture/adr-0002-apply-action-command-model.md
    added: 2026-07-23

  - pattern: global_rng
    status: active
    description: "The global RNG functions randi() / randf() / randi_range() / randf_range() / randomize() / seed() are banned project-wide. Randomness is ONLY via a dedicated RandomNumberGenerator instance with an explicit seed, used once in Grid map-gen (see api_decisions: randomness). No RNG of any kind touches per-turn state advancement."
    why: "The global RNG is one hidden shared stream — any stray call (an effect, helper, test) silently perturbs the sequence and breaks map-gen reproducibility + determinism (ADR-0003 Rule 1). CI greps for these calls outside the sanctioned instance."
    adr: docs/architecture/adr-0003-deterministic-simulation-rng-isolation.md
    added: 2026-07-23

  - pattern: float_in_state
    status: active
    description: "No float field may appear on a state class (GameState, PlayerState, EntityState, GridState). State is int / enum / Vector2i only. Fractional gameplay coefficients (e.g. SOFT_MOVE_PENALTY, CANCEL_REFUND_RATE) are stored as scaled integers (PENALTY_X10 = 15) and computed with integer ceil/floor-division. Floats are allowed ONLY in AI advisory scoring (never written to state) and pure presentation (animation)."
    why: "Integer arithmetic is bit-identical across platforms; float accumulation/rounding is not. Float state reintroduces nondeterminism that breaks the golden-replay test and AI clone-lookahead (ADR-0003 Rule 2; TR-gamestate-009)."
    adr: docs/architecture/adr-0003-deterministic-simulation-rng-isolation.md
    referenced_by:
      - docs/architecture/adr-0009-reachable-search-pathfinding.md   # UnitConfig.soft_move_penalty_x10 fixed-point (20 = 2.0); surcharge via integer ceil-div, per TR-movement-011
      - docs/architecture/adr-0017-base-production-mechanics.md   # BaseProductionConfig.cancel_refund_pct (int 50) fixed-point for CANCEL_REFUND_RATE; refund = build_cost*pct/100 integer-div (floors)
    added: 2026-07-23

  - pattern: nondeterministic_iteration_order
    status: active
    description: "Order-sensitive operations (batch build/research completion in one tick, AI action enumeration, multi-event resolution) must NOT rely on Dictionary hash or insertion order. Spatial iteration uses flat arrays indexed y*GRID_WIDTH+x; order-sensitive entity passes iterate a list sorted by a stable key (entity_id, or tile index)."
    why: "Iteration order must be a property of the data, not the container. Coupling correctness to insertion history is fragile across clone()/rebuild and breaks determinism (ADR-0003 Rule 3; TR-movement-006/007)."
    adr: docs/architecture/adr-0003-deterministic-simulation-rng-isolation.md
    added: 2026-07-23

  - pattern: entity_ref_in_spatial_index
    status: active
    description: "A spatial index (Grid occupancy, or any future spatial cache/lookup) must store entity_id (int), never an EntityState reference. The single source of entity objects is GameState.entities_by_id; indexes hold ids and resolve via GameState.entity_at."
    why: "If both the grid and entities_by_id held EntityState references, duplicate_deep() (clone()) would deep-copy the same unit into two divergent objects — a tile's occupant would no longer BE the object in entities_by_id. A silent aliasing bug in the project's most safety-critical operation (ADR-0005)."
    adr: docs/architecture/adr-0005-grid-representation-map-format.md
    added: 2026-07-23

  - pattern: config_resource_runtime_mutation
    status: active
    description: "EconomyConfig (and any future per-system tuning Resource loaded via a thin Balance-style Autoload) must never be mutated at runtime. It is load-time tuning data, not GameState — only the resource editor (or a build-time tool) writes its fields."
    why: "Runtime mutation of config would make income() (and any other config-driven formula) no longer a pure function of board state, breaking determinism (ADR-0003) and blurring the state/config boundary this ADR deliberately drew to keep EconomyConfig off GameState's clone path."
    adr: docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
    added: 2026-07-23

  - pattern: runtime_load_of_type_templates
    status: active
    description: "Never runtime-load() a stat-template .tres (UnitTypeDef/StructureTypeDef/TechDef) outside its registry Autoload. Every reference to a template goes through the preload'd registry const (UnitTypes.SCOUT, StructureTypes.ECONOMY_OUTPOST, Techs.ATTACK_TECH). Type identity is tested by Resource-reference equality against those consts."
    why: "load('res://data/units/scout.tres') returns a SECOND Resource instance — identical content, different object identity — so `structure.type == StructureTypes.ECONOMY_OUTPOST` silently evaluates false against it. The entire type-identity mechanism (ADR-0007) and the zero-clone-cost sharing guarantee depend on there being exactly one preload'd instance per template. A stray load() is a plausible-looking silent bug."
    adr: docs/architecture/adr-0007-entity-stat-schema.md
    referenced_by:
      - docs/architecture/adr-0018-research-tech-mechanics.md   # Lab.current_research_target holds a Techs.* preload'd const; == identity relies on the single-instance guarantee (post-clone too)
    added: 2026-07-23

  - pattern: start_of_turn_step_reordering
    status: active
    description: "GameState.start_turn()'s 4 steps run in a FIXED order: (1) set active_player → (2) reset per-turn flags → (3) advance build + research timers (completing structures/techs) → (4) AP.reset_turn() income snapshot. Step 4 MUST come after step 3; steps 2/3 must precede step 4. The two timer-advance calls WITHIN step 3 (build vs research) are order-INDEPENDENT and must stay so (assert commutativity, don't rely on one running first)."
    why: "The income snapshot (step 4) must observe structures/techs that completed this same turn — reordering step 4 before step 3 silently breaks base-production.md Rule 6 + research-tech.md Rule 5 ('a just-completed Economy Outpost counts toward income this turn'). Coupling correctness to the build-vs-research order within step 3 would contradict research-tech.md's explicit joint-completion rule (both complete regardless of which advance ran first)."
    adr: docs/architecture/adr-0008-start-of-turn-sequencing.md
    added: 2026-07-23

  - pattern: astar_for_grid_movement
    status: active
    description: "Never use AStarGrid2D / AStar2D (or NavigationServer2D / NavigationAgent2D) for the movement reachable-search. Movement pathfinding is a hand-rolled BFS-by-depth over GridState's neighbors()/is_passable()/occupant_at() API (see api_decisions: movement_search_module_shape)."
    why: "OVERCLOCK's move cost is DEPTH-DEPENDENT (the soft_move_cap surcharge depends on cumulative tiles_moved_this_turn + steps-so-far). AStarGrid2D's _compute_cost/_estimate_cost callbacks receive only the two grid endpoints, with no accumulated path-depth (g_score) parameter — so the surcharge cannot be computed inside them without external mutable state, which breaks A*'s closed-set 'a settled node's cost is final' invariant (the same tile has different entry costs on different-depth paths). The Navigation module is for continuous-space navmesh agents, not a logical tile grid. This is a tempting-but-wrong reach for any future ADR that adds pathfinding (e.g. AI positional queries)."
    adr: docs/architecture/adr-0009-reachable-search-pathfinding.md
    added: 2026-07-24

  - pattern: physics_engine_for_grid_combat
    status: active
    description: "Never use the physics engine (PhysicsServer2D ray/shape queries, Area2D/RayCast2D nodes, Jolt) for combat targeting, line-of-fire, or range. DIRECT line-of-fire is a tile walk over GridState.occupant_at()/is_passable(); range is integer manhattan_distance / cardinal step count; hit resolution is the integer damage formula. Applies to any future targeting/LoS/AoE query too."
    why: "Combat is deterministic integer/grid logic (ADR-0003). Physics raycasts are float-based, continuous-space, and not bit-reproducible across platforms/frames — using one would reintroduce the nondeterminism the whole simulation is built to avoid, break clone-parity for AI lookahead, and pull in the 4.6 Jolt-default surface for zero benefit. technical-preferences.md already scopes physics out of this 2D tactics game."
    adr: docs/architecture/adr-0010-combat-resolution-destruction-wincheck.md
    added: 2026-07-24

  - pattern: local_to_map_for_iso_picking
    status: active
    description: "Never use TileMapLayer.local_to_map() (nor map_to_local() for our own coordinate math) for isometric screen<->grid conversion or mouse picking. All grid<->screen conversion goes through BoardRenderer's hand-rolled closed-form grid_to_screen()/screen_to_grid() exact-inverse pair (see api_decisions: board_render_transform). Applies to any future picking/hit-test/overlay-placement code, not just the initial Board Renderer."
    why: "local_to_map() has a documented accuracy bug for TILE_SHAPE_ISOMETRIC (GH#89423, QQ-03-verified 2026-07-23) — it does not reliably invert the iso projection. Mixing an engine forward transform with a hand-rolled inverse also risks the two drifting apart at edge pixels, a preview-vs-commit-style bug at the render seam (violates Architecture Principle 5). The hand-rolled pair is provably exact and sidesteps the engine bug entirely."
    adr: docs/architecture/adr-0013-isometric-board-rendering.md
    added: 2026-07-24

  - pattern: manual_input_focus_arbitration
    status: active
    description: "Never write manual arbitration code to decide 'who owns this keypress right now' between the BoardCursor and a focused menu Control, nor hand-roll per-frame focus-ring suppression on inert Controls. Bind BoardCursor stepping to the same ui_up/ui_down/ui_left/ui_right actions Control focus-neighbor traversal uses and read them in _unhandled_input — Godot's own input-consumption order (a focused Control consumes the event in the GUI pass, marking it handled, so it never reaches _unhandled_input) IS the arbitration. Inert Controls use focus_mode=FOCUS_NONE, not a hand-rolled suppression loop."
    why: "The arbitration is a structural consequence of Godot's synchronous top-down input dispatch — writing an explicit ownership flag re-implements engine behavior, adds a state variable that can desync, and is exactly the tempting-but-wrong approach a downstream input/UI ADR or story might reach for. The last-input-handler-wins precedence rule (TR-cmdui-020) relies on this same single-owner-Node dispatch model; a second Node fielding its own _unhandled_input would reintroduce tree-order ambiguity. NOTE: the 4.6-dual-focus-specific propagation behavior is gated behind a pre-Accepted spike (see api_decisions: focus_management) — this ban is on hand-rolled arbitration, not a claim the spike is already passed."
    adr: docs/architecture/adr-0014-input-focus-architecture.md
    added: 2026-07-24

  - pattern: screen_axis_board_cursor
    status: active
    description: "BoardCursor.step() moves along the LOGICAL grid's own (x,y) axes only (ui_up -> y-1, ui_down -> y+1, ui_left -> x-1, ui_right -> x+1) — NEVER along the iso screen's visually-diagonal directions. No grid<->screen transform (BoardRenderer.grid_to_screen/screen_to_grid) appears anywhere in board-cursor MOVEMENT logic; the transform is used ONLY to place the cursor's on-screen indicator, never to compute its next tile. Applies to any future board-space keyboard/gamepad navigation, not just the initial cursor."
    why: "OVERCLOCK renders 2:1 dimetric isometric but every gameplay rule lives in logical grid space (the change-impact report's zero-rule-change finding; ADR-0013's view-layer boundary). Stepping a cursor by screen axes would make D-pad movement feel diagonal/wrong on the grid and couple input to the render transform — a tempting-but-wrong reach precisely because the board LOOKS diagonal. TR-cmdui-019 mandates grid-axis stepping."
    adr: docs/architecture/adr-0014-input-focus-architecture.md
    added: 2026-07-24

  - pattern: balance_constant_in_presentation_layer
    status: active
    description: "The Command & Action Interface (command_fsm.gd/command_interface.gd) — and any preview/HUD presentation layer — must hold ZERO copies of any owning-system balance constant (move_cost, SOFT_MOVE_PENALTY, attack_cost, COVER_DR, CANCEL_REFUND_RATE, BASE_INCOME, etc.) and must never re-derive an owning-system formula locally. Every displayed cost/damage/legality/refund value is the LITERAL return of that owning system's side-effect-free query (Movement.reachable's is_surcharged/min_cost, Combat.preview_damage, AP.can_afford/current_ap, BaseProduction.cancel_build's refund), evaluated at render time. projected_remaining_ap is one subtraction of two query returns; the in-cap/over-cap split is consumed from reachable()'s is_surcharged flag, NEVER inferred from min_cost."
    why: "This is the Pass-Through Invariant (command-action-interface.md CR-2/TR-cmdui-010), the load-bearing promise that 'a preview is a guarantee, not an estimate' — the number shown at preview is exactly the number charged at commit. A duplicated balance constant in the UI is a second source of truth that silently desyncs the moment the owning system retunes, reintroducing the preview-vs-commit disagreement the whole layer exists to prevent. Enforced structurally by the pure CommandFSM core (which can reach cost/legality only by calling a query — see api_decisions: command_fsm_module_shape) PLUS a candidate greppable lint/CI check that fails on any owning-system constant name appearing in this layer (same static-allowlist discipline as ADR-0011's AI read set). Also applies to the HUD (TR-hud-018) — enforced there by the GameStateReader facade (hud_module_shape)."
    adr: docs/architecture/adr-0015-command-action-interface-fsm.md
    added: 2026-07-24

  - pattern: multi_owner_audio_play
    status: active
    description: "A shared audio event (the AP-tick on a commit, a completion chime, a turn stinger, the victory/defeat cue) has EXACTLY ONE play() owner. Two systems must never both call play() for the same logical sound. Every other interested system subscribes to the same trigger signal for its VISUAL reaction only and stays audio-silent. Concretely: the AP-tick sound is owned by the HUD's single HudAudioDispatcher (bound to the apply_action-committed signal, NOT an ap_changed value-change); #9's commit-flash and the HUD counter-tick subscribe to that same signal for visuals but do not play() (game-hud.md Audio C). The attack-commit sound is owned by Combat off the same action_applied event; #9 abstains. Structure-complete reuses #9's Build-stamp ASSET but Base & Production owns the TRIGGER (its build-timer completes it) — asset reuse is not trigger ownership."
    why: "Two play() call sites on one shared cue is the double-trigger bug AC-20 exists to catch — it produces a flanged/doubled sound and makes the total audio priority order (GameOver > stinger > completion[deduped] > AP-fill, TR-hud-021) impossible to resolve coherently because the deciding logic is split across systems that cannot see each other's cues. A single dispatcher is the only place the duck/hard-preempt/dedup ordering can be resolved. Binding audio to a value-change (ap_changed) instead of the commit signal is a second form of this bug (fires for non-commit reasons). Enforced by an AC-20 call-count spy on the play() entry point the ADR designates."
    adr: docs/architecture/adr-0016-game-hud.md
    added: 2026-07-24

  - pattern: faction_owns_base_value
    status: active
    description: "Faction Identity is a MODIFIER PROVIDER only — it must never own, read, mutate, or recompute a base value or formula owned by another system (Unit cost/mobility, AP income curve, structure cost/time/cap, tech cost/time, combat stats). Every faction effect resolves as effective_X(state, base_owner, player) = clamp(base_X + delta, floor, inf) AT THE OWNING SYSTEM'S read site (CR-4); the faction supplies only the additive int delta (via typed Array[Faction*Delta] entries). A faction delta is ADDITIVE int, never a multiplicative factor (integer-AP invariant). A faction may only re-cost/re-time/re-scale actions ALREADY priced in AP (CR-3): never a second resource, a 0-AP version of a paid verb, a new verb, or a value outside CR-2's closed 6 domains. The production_cap delta may not cross the produces/doesn't-produce boundary in either direction (two-sided inert, TR-faction-006). Faction identity is a Resource-reference (== Factions.X), never a parallel enum/string discriminator."
    why: "CR-4's 'live modifier resolution, no base mutation' is what keeps Neutral provably inert (effective_X == base_X exactly) and lets a faction be tuned as data without touching system logic (CR-1). A central Faction service that computed effective values itself would have to read/own 5 systems' base values, re-accreting cross-system logic onto faction and breaking the single-owner-per-value discipline the whole corpus rests on. A multiplicative delta breaks integer-AP (Pillar 1 / ADR-0003). Manufacturing or deleting a verb (production_cap crossing 0, a 0-AP paid action, a new verb) breaks Pillar 1's 'no parallel resource / one AP economy'. Enforced by the Neutral regression pin (TR-faction-011), the closed-schema load reject (TR-faction-002), the two-sided cap branch (TR-faction-006), and a per-FactionDef design-review checklist for the CR-3 universals that aren't black-box-testable."
    adr: docs/architecture/adr-0012-faction-identity-modifier-framework.md
    added: 2026-07-24

  - pattern: stored_terminal_structure_state
    status: active
    description: "A structure's persisted lifecycle is the 2-value StructureState.BuildStatus{UNDER_CONSTRUCTION, COMPLETED} (ADR-0007) ONLY. 'Destroyed' and 'Removed' must NOT be stored as extra BuildStatus enum values or kept as lingering rows — both are terminal EXITS that erase the structure from entities_by_id AND remove it from Grid occupancy in the same step: voluntary cancel via BaseProduction.cancel_build (credits the fixed-point refund), combat destruction via GameState.destroy_entity (ADR-0010, no refund). Invariant: a structure exists ⇔ it is in entities_by_id and occupies a Grid tile."
    why: "Storing DESTROYED/REMOVED as a state forces every consumer (Grid, Combat, completed_outpost_count, HUD, AI enumeration) to add an 'is it actually alive?' filter and creates two representations of 'gone' (a dead row AND absence) that silently drift. The single alive-invariant keeps consumers filter-free and matches the entity_ref_in_spatial_index / single-source-of-entity-objects discipline (ADR-0005). Rejected Alternative 2 in ADR-0017."
    adr: docs/architecture/adr-0017-base-production-mechanics.md
    added: 2026-07-24

  - pattern: stored_tech_status_table
    status: active
    description: "Do NOT store a separate per-(player, tech) research-status table (e.g. a Dictionary[TechDef, Status] on PlayerState). The tri-state status (Not Started / Under Research / Completed) is DERIVED: COMPLETED = the player's has_<tech>_tech flag (player_tech_unlocks); UNDER_RESEARCH = some Completed Lab of that player has current_research_target == tech (Resource-ref); else NOT_STARTED. The 3 PlayerState bool flags + each Lab's current_research_target are the single source of truth."
    why: "A stored table duplicates (flags + Lab targets) and gives 'Under Research' two representations that silently drift; it also forces Research.on_lab_destroyed to actively rewrite it. The derived model keeps one source of truth and makes destruction-revert AUTOMATIC (erasing the Lab removes its current_research_target, so the tech falls back to Not Started with no bookkeeping) — which is exactly what makes research-tech.md Rule 6 (progress lost on Lab death) and Rule 8 (completed techs survive) structural. Rejected Alternative 2 in ADR-0018."
    adr: docs/architecture/adr-0018-research-tech-mechanics.md
    added: 2026-07-24

