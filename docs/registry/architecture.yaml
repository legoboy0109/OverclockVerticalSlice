# ─── STATE OWNERSHIP ─────────────────────────────────────────────────────────
# Who is the authoritative owner of each piece of shared game state.
# Conflicts: two ADRs claiming to own the same state = data race / authority bug.
#
# Register state when it is READ or WRITTEN by more than one system.
# Internal-only state (never accessed by another system) does not need to be registered.
#
# Required fields: state, owner_system, adr, interface, referenced_by[], added
# interface: how other systems access this state (read-only property, method call,
#   signal, shared resource, etc.) — this is the contract other ADRs depend on.

state_ownership:
  - state: authoritative_game_state
    status: active
    owner_system: game-state-turn-manager
    adr: docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    interface: "GameState (Resource, not Node). Read API side-effect-free (active_player, current_ap(player), round_number, match_status, entities(), entity_at(tile), grid, faction_of(player)); clone() -> GameState deep copy for lookahead; mutate ONLY via apply_action(action). ADR-0008 adds field starting_player (int, set once by start_match(), immutable after) and method start_turn(player) -> Array[Event] (GameState's own turn-boundary orchestrator, invoked by start_match() and EndTurnAction.apply()). ADR-0010 adds method destroy_entity(entity_id) -> Array[Event] (the sole same-step destruction hook — Grid removal + forward-declared Research.on_lab_destroyed + Destroyed events; called only from inside a verb handler's apply()). ADR-0011 adds field PlayerState.is_ai_controlled (bool, set once at Setup, immutable after Setup->PlayerTurn — same lock as PlayerState.faction; the data-model backing for 'active player, human or AI' that game-state-turn-manager.md's prose assumed but had no field for). ADR-0012 adds field PlayerState.faction (FactionDef ref, set once at the SELECTING->ASSIGNED setup commit, immutable after Setup->PlayerTurn — same Setup-lock; faction_of(player) returns it; survives clone() as a shared path-having preload'd Resource, zero copy cost per ADR-0007). ADR-0018 adds three PlayerState bool fields has_attack_tech/has_defense_tech/has_economy_tech (Setup-init false, sole writer Research.advance_research_timers on tech completion, never reset — see state_ownership: player_tech_unlocks)."
    write_access: apply_action-only   # no system writes GameState fields directly (start_turn/destroy_entity run inside a verb handler's apply, itself under apply_action; is_ai_controlled set once at Setup then locked; tech flags written only by advance_research_timers under start_turn)
    referenced_by:
      - docs/architecture/adr-0001-state-model-ownership-lifecycle.md
      - docs/architecture/adr-0008-start-of-turn-sequencing.md   # adds starting_player field + start_turn() method
      - docs/architecture/adr-0010-combat-resolution-destruction-wincheck.md   # adds destroy_entity() method
      - docs/architecture/adr-0011-ai-opponent-decision-loop.md   # adds PlayerState.is_ai_controlled field (Setup-locked like faction)
      - docs/architecture/adr-0013-isometric-board-rendering.md   # BoardRenderer reads entities()/entity_at() read-only to know what to draw
      - docs/architecture/adr-0012-faction-identity-modifier-framework.md   # adds PlayerState.faction field (Setup-locked) + faction_of(player) accessor; clone-survival relies on ADR-0007's shared-path-having-Resource finding
      - docs/architecture/adr-0018-research-tech-mechanics.md   # adds 3 PlayerState tech-unlock bool fields (see player_tech_unlocks)
    added: 2026-07-23
    revised: 2026-07-24

  - state: entity_id
    status: active
    owner_system: game-state-turn-manager
    adr: docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    interface: "Deterministic int, assigned from GameState.next_entity_id counter, incremented by apply_action on entity creation. Unique within one GameState; clone() preserves ids."
    write_access: apply_action-only
    referenced_by:
      - docs/architecture/adr-0001-state-model-ownership-lifecycle.md
    added: 2026-07-23
    revised: ""

  - state: grid_occupancy
    status: active
    owner_system: grid-terrain
    adr: docs/architecture/adr-0005-grid-representation-map-format.md
    interface: "GridState (Resource field of GameState). Read: in_bounds, terrain_at, is_cover, is_passable, occupant_at (returns entity_id, or -1), neighbors (4-dir), manhattan_distance. Mutate: place(entity_id,x,y), remove(x,y), move(from,to) — single-occupant invariant. terrain is static PackedByteArray post-load; occupancy is PackedInt32Array of entity_id. occupant_at returns an id; GameState.entity_at resolves it to EntityState."
    write_access: apply_action-only   # place/remove/move called only inside apply_action handlers
    referenced_by:
      - docs/architecture/adr-0005-grid-representation-map-format.md
    added: 2026-07-23
    revised: ""

  - state: current_ap
    status: active
    owner_system: ap-economy
    adr: docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
    interface: "PlayerState.current_ap (int, read via GameState). Written ONLY by AP.spend() (deduction, called from inside a verb handler's apply(), ADR-0002 step 5) and AP.reset_turn()/AP.discard() (turn-boundary writes, invoked by ADR-0008's start-of-turn sequence). Read via can_afford(player, amount) / current_ap(player)."
    write_access: ap-economy-only   # AP.spend() (in apply()) and AP.reset_turn()/AP.discard() (turn boundary)
    referenced_by:
      - docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
      - docs/architecture/adr-0008-start-of-turn-sequencing.md   # start_turn() step 4 calls AP.reset_turn(); EndTurnAction.apply() calls AP.discard()
    added: 2026-07-23
    revised: 2026-07-23

  - state: income_this_turn
    status: active
    owner_system: ap-economy
    adr: docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
    interface: "PlayerState.income_this_turn (int). Frozen start-of-turn snapshot; sole writer AP.reset_turn(), invoked once per player per start-of-turn (ADR-0008). Immune to same-turn increase/decrease in the underlying formula inputs (GDD Rule 5)."
    write_access: ap-economy-only   # AP.reset_turn() only
    referenced_by:
      - docs/architecture/adr-0006-ap-economy-data-model-spend-contract.md
      - docs/architecture/adr-0008-start-of-turn-sequencing.md   # start_turn() step 4 invokes AP.reset_turn() at the correct sequence position
    added: 2026-07-23
    revised: 2026-07-23

  - state: player_tech_unlocks
    status: active
    owner_system: research-tech
    adr: docs/architecture/adr-0018-research-tech-mechanics.md
    interface: "Three PlayerState bool fields — has_attack_tech / has_defense_tech / has_economy_tech (Setup-init false). Read live via Research.has_attack_tech(state,player)/has_defense_tech/has_economy_tech accessors by Unit System (effective_attack/effective_defense) and by ADR-0007's economy_tech_income_bonus (has_economy_tech). Tri-state tech status is DERIVED, not stored: COMPLETED = flag true; UNDER_RESEARCH = some player Completed Lab has current_research_target == tech; else NOT_STARTED (see forbidden: stored_tech_status_table)."
    write_access: research-tech-only   # SOLE writer = Research.advance_research_timers() on tech completion (runs inside start_turn step 3); flags are one-way (never reset to false — permanence, survive Lab destruction, research-tech.md Rule 6/8)
    referenced_by:
      - docs/architecture/adr-0018-research-tech-mechanics.md
      - docs/architecture/adr-0008-start-of-turn-sequencing.md   # advance_research_timers sets these flags (registered signature)
      - docs/architecture/adr-0007-entity-stat-schema.md   # economy_tech_income_bonus reads has_economy_tech
    added: 2026-07-24
    revised: ""

