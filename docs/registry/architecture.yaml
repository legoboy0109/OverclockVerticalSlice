    api: "Hand-rolled closed-form grid<->screen 2:1 dimetric pair on BoardRenderer (Node2D): grid_to_screen(tile: Vector2i) -> Vector2 = origin_offset_px + Vector2((x-y)*TILE_W/2, (x+y)*TILE_H/2); screen_to_grid(px) -> Vector2i via the algebraic inverse (u = sx/TILE_W + sy/TILE_H, v = sy/TILE_H - sx/TILE_W, then floori). Provably exact inverses (godot-specialist-verified numerically 2026-07-24: exact full-board round-trip, deterministic lower-index boundary tie-break, tile-size-independent). grid_to_screen(tile) is ALSO the sprite placement anchor (art bible §8.4 ground-contact pivot). picking = BoardRenderer.pick_at(px) -> PickResult{tile, occupant_entity_id}: occupant-sprite front-to-back test first, then screen_to_grid diamond fallback."
